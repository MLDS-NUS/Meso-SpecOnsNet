_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 10

accelerator: cpu
devices: 1

# perform a validation loop every N training epochs

# mixed precision for extra speed-up
# precision: 16

# logger (instantiated in train.py)
# callbacks (instantiated in train.py)

# fast_dev_run: False
# max_epochs: 1000 # -1 for no limit
# min_epochs: null
# max_steps: -1
# min_steps: null
# max_time: null

# limit_train_batches: 1.0 # how much of training dataset to check
# limit_val_batches: 1.0 # how much of validation dataset to check
# limit_test_batches: 1.0 # how much of test dataset to check

# overfit_batches: 0.0 # overfit a fraction of training data

# val_check_interval: 1.0 # how often to run validation
# float in [0.0, 1.0] indicates the fraction
# int indicates the number of training batches

# check_val_every_n_epoch: 1 # how often to run validation (epoch-wise)

# num_sanity_val_steps: 2 # how many validation steps for sanity check before training
# log_every_n_steps: 50 # how often to log training metrics

# enable_checkpointing: True # whether to save checkpoints if no user-defined callbacks
# enable_progress_bar: True # whether to show progress bar
# enable_model_summary: True # whether to show model summary in logs

# accumulate_grad_batches: 1 # how many batches to accumulate gradients over
# gradient_clip_val: null # value to clip gradients by
# gradient_clip_algorithm: 'norm' # algorithm to use for gradient clipping
# detect_anomaly: false # whether to detect anomalies in gradients
# sync_batchnorm: false # whether to synchronize batch normalization across devices

# set True to to ensure deterministic results
# makes training slower but gives more reproducibility than just setting seeds
deterministic: false

# inference_mode: true # whether to run in inference mode for validation and test

# use_distributed_sampler: # whether to use distributed sampler for training dataloader

profiler: simple
